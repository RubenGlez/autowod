name: CF Diagnostic (throwaway)
run-name: "🔎 CF challenge probe"

# Read-only probe of the login page from a GitHub datacenter runner.
# No login, no booking. Triggered by pushes to this throwaway branch so it
# runs without needing to live on the default branch. Delete once we have
# the answer.
on:
  push:
    branches:
      - fix/captcha-managed-challenge
  workflow_dispatch:

jobs:
  probe:
    name: Probe login page
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Get latest code
        uses: actions/checkout@v6

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🌐 Install Chrome for Puppeteer
        run: pnpm exec puppeteer browsers install chrome

      - name: 🔎 Run probe
        run: node diagnostics/cf-probe.mjs

      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-probe
          path: |
            cf-probe.png
            cf-probe.html
          if-no-files-found: ignore
